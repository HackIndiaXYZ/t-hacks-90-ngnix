services:
  - type: web
    name: sakhi-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SAKHI_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
